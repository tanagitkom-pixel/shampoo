<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — shampoo</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* สไตล์เฉพาะหน้าสั่งซื้อ (ใช้ตัวแปรจาก style.css) */
    .order-wrap {
      max-width: 560px;
      margin-inline: auto;
      padding: var(--space-lg) var(--space-lg) var(--space-md);
      background: var(--color-white);
      border: var(--line-width) solid var(--color-line);
    }

    .order-wrap textarea {
      min-height: 90px;
      resize: vertical;
    }

    .order-wrap .btn {
      margin-top: var(--space-lg);
    }

    .form-hint {
      margin: var(--space-xs) 0 0;
      font-size: 0.8rem;
      color: var(--color-ink-muted);
    }

    @media (max-width: 600px) {
      .order-wrap { padding: var(--space-md) 1.25rem; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a href="index.html" class="logo">shampoo</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section__header">
          <span class="eyebrow">Order</span>
          <h1>สั่งซื้อสินค้า</h1>
          <hr class="divider">
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <div class="order-wrap">
          <form id="orderForm">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>

            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>

            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>

            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="number" id="total" name="total" min="0" inputmode="numeric" required>

            <label for="note">หมายเหตุ</label>
            <textarea id="note" name="note" placeholder="เช่น ที่อยู่จัดส่ง หรือข้อความถึงทางร้าน"></textarea>

            <div class="text-center">
              <button type="submit" class="btn btn--solid">ยืนยันสั่งซื้อ</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="logo">shampoo</span>
      <p>&copy; 2026 shampoo. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
